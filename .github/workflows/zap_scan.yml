name: "Final: Siêu Pipeline DevSecOps Kill-Switch"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  security_scan_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. SAST: Quét mã nguồn với Snyk (Nếu lỗi cũng không dừng Pipeline)
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # 2. DAST: Quét Web với ZAP Full Scan (Quét cực kỹ)
      - name: Chuan bi file bao cao
        run: |
          touch report.html
          chmod 777 report.html

      - name: Chay ZAP FULL SCAN (Authenticated)
        run: |
          docker run --rm -v $(pwd):/zap/wrk/:rw -u 0 -t zaproxy/zap-stable zap-full-scan.py \
            -t https://dungtuandiszkont.hu/ \
            -r report.html || true
            

      # 3. LOGIC "BAN" TRANG WEB: Tự động kích hoạt dựa trên kết quả quét
      - name: Create index.html based on security status
        run: |
          # giải thích chỗ này:``
          # 1. Tìm chữ "High" hoặc "Medium" (Lỗi nghiêm trọng)
          # 2. HOẶC tìm chữ "login" (Dấu hiệu tấn công vào trang đăng nhập)
          if [ -f report.html ] && (grep -Ei "High|Medium" report.html || grep -qi "login" report.html); then
            echo "🚨 PHAT HIEN NGUY CO LOGIN / LOI NGIEM TRONG - KICH HOAT BAN 🚨"
            cp attack.html index.html
          else
            echo "✅ Hệ thống an toàn - Duy trì trạng thái bình thường"
            cp normal.html index.html
          fi
          touch .nojekyll
      # 4. TRIỂN KHAI LÊN GITHUB PAGES
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Đẩy toàn bộ thư mục hiện tại lên
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4