name: "Final: Siêu Pipeline DevSecOps Kill-Switch"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  security_scan_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. SAST: Quét mã nguồn với Snyk (Nếu lỗi cũng không dừng Pipeline)
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # 2. DAST: Quét Web với ZAP Full Scan (Xuất file JSON thay vì HTML)
      - name: Chuan bi file bao cao
        run: |
          touch report_juiceshop.json
          touch report_phpshop.json
          chmod 777 report_juiceshop.json
          chmod 777 report_phpshop.json
          

      # ==================== PHẦN A: QUÉT ỨNG DỤNG CÓ SẴN (JUICE SHOP) ====================
      - name: Chay ZAP Quet Juice Shop (Authenticated)
        run: |
          docker run --rm -v $(pwd):/zap/wrk/:rw -u 0 -t zaproxy/zap-stable zap-full-scan.py \
            -t https://playlist-plow-briar.ngrok-free.dev \
            -J report_juiceshop.json \
            -z "-config replacer.full_list(0).description=auth \
                -config replacer.full_list(0).enabled=true \
                -config replacer.full_list(0).matchtype=REQ_HEADER \
                -config replacer.full_list(0).matchstr=Authorization \
                -config replacer.full_list(0).regex=false \
                -config replacer.full_list(0).replacement='Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9.eyJzdGF0dXMiOiJzdWNjZXNzIiwiZGF0YSI6eyJpZCI6MSwidXNlcm5hbWUiOiIiLCJlbWFpbCI6ImFkbWluQGp1aWNlLXNoLm9wIiwicGFzc3dvcmQiOiIwMTkyMDIzYTdiYmQ3MzI1MDUxNmYwNjlkZjE4YjUwMCIsInJvbGUiOiJhZG1pbiIsImRlbHV4ZVRva2VuIjoiIiwibGFzdExvZ2luSXAiOiIiLCJwcm9maWxlSW1hZ2UiOiJhc3N assetHMvcHVibGljL2ltYWdlcy91cGxvYWRzL2RlZmF1bHRBZG1pbi5wbmciLCJ0b3RwU2VjcmV0IjoiIiwiaXNBY3RpdmUiOnRydWUsImNyZWF0ZWRBdCI6IjIwMjYtMDUtMTcgMDk6MDA6NDguMTMxICswMDowMCIsInVwZGF0ZWRBdCI6IjIwMjYtMDUtMTcgMDk6MDA6NDguMTMxICswMDowMCIsImRlbGV0ZWRBdCI6bnVsbH0sImlhdCI6MTc3OTAwODYxMH0.Ht13ia374h0OKhEX3blETuBFTrLBFT2xhUqHya58CC2kT1EDYG9JhkbA0qhonBiEGVoTfFJ88LXts_hSJtz67MQjW1MkEoQ7cgLC8UfIjO0MQwv4W7KGpE80CnlRdpcfn7J_90maW4_H2CbcaKBmbSRyvt2WqNoqzPOb81ODY8g'" || true

      # ==================== PHẦN B: QUÉT ỨNG DỤNG TỰ LÀM (PHP SHOP) ====================
      - name: Chay ZAP Quet Web PHP Tu Lam (Unauthenticated)
        run: |
          docker run --rm -v $(pwd):/zap/wrk/:rw -u 0 -t zaproxy/zap-stable zap-full-scan.py \
            -t https://856d56ea7363bb.lhr.life \
            -J report_phpshop.json || true
            

      # 3. LOGIC ĐÁNH GIÁ RỦI RO (QUALITY GATE CHUẨN DEVSECOPS)
      - name: Security Quality Gate (Risk Evaluation)
        run: |
          # Dùng jq để trích xuất chính xác trường riskcode từ file JSON (3 = High, 2 = Medium)
          HIGH_PHP=$(jq '[.. | objects | select(.riskcode == "3")] | length' report_phpshop.json 2>/dev/null || echo 0)
          MED_PHP=$(jq '[.. | objects | select(.riskcode == "2")] | length' report_phpshop.json 2>/dev/null || echo 0)
          
          HIGH_JUICE=$(jq '[.. | objects | select(.riskcode == "3")] | length' report_juiceshop.json 2>/dev/null || echo 0)
          MED_JUICE=$(jq '[.. | objects | select(.riskcode == "2")] | length' report_juiceshop.json 2>/dev/null || echo 0)
          
          HIGH_COUNT=$((HIGH_PHP + HIGH_JUICE))
          MEDIUM_COUNT=$((MED_PHP + MED_JUICE))
          
          echo "📊 TỔNG KẾT: Hệ thống phát hiện $HIGH_COUNT lỗi HIGH và $MEDIUM_COUNT lỗi MEDIUM."

          # Đưa ra quyết định bằng ngưỡng rủi ro
          if [ "$HIGH_COUNT" -gt 0 ]; then
            echo "🚨 KÍCH HOẠT KILL-SWITCH: CÓ LỖI HIGH NGHIÊM TRỌNG."
            echo "❌ Đánh sập Pipeline ngay lập tức để ngăn chặn bước Deploy!"
            exit 1 
            
          elif [ "$MEDIUM_COUNT" -gt 5 ]; then
            echo "::warning::⚠️ CẢNH BÁO BẢO MẬT: Phát hiện $MEDIUM_COUNT lỗi MEDIUM."
            echo "✅ Hệ thống chưa chạm ngưỡng nguy hiểm. VẪN CHO PHÉP WEB DEPLOY!"
            exit 0
            
          else
            echo "✅ AN TOÀN: Hệ thống ổn định (Rủi ro thấp). Tiếp tục tiến trình Deploy!"
            exit 0
          fi
          touch .nojekyll

          
      # 4. TRIỂN KHAI LÊN GITHUB PAGES
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' 
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4